
name: Generate Minecraft Registries

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Java 24
        run: |
          curl -fL -o jdk.tar.gz \
            https://download.java.net/java/GA/jdk24.0.2/fdc5d0102fe0414db21410ad5834341f/12/GPL/openjdk-24.0.2_linux-x64_bin.tar.gz
          tar -xzf jdk.tar.gz

      - name: Generate Minecraft data
        run: |
          mkdir -p notchian
          cd notchian

          curl -fL -o server.jar \
            https://piston-data.mojang.com/v1/objects/6bce4ef400e4efaa63a13d5e6f6b500be969ef81/server.jar

          echo "eula=true" > eula.txt

          ../jdk-24.0.2/bin/java \
            -DbundlerMainClass="net.minecraft.data.Main" \
            -jar server.jar --all

      - name: Generate C registry files
        run: bun run build_registries.js

      - name: Save generated files to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/registries.c include/registries.h

          if ! git diff --cached --quiet; then
            git commit -m "Generate Minecraft 1.21.8 registries"
            git push
          else
            echo "Registry files are already up to date."
          fi
